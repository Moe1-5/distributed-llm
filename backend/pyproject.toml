[project]
name = "distribllm-backend"
version = "0.1.0"
description = "P2P Distributed LLM Inference Backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
    "transformers>=5.3.0",
    "accelerate>=1.6.0",
    "hivemind>=1.1.12",
    "psutil>=6.1.0",
    "nvidia-ml-py>=12.560.30",
    "cryptography>=46.0.5",
    "blake3>=1.0.8",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "python-cu121" }
